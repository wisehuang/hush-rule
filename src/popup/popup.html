<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hush Rules</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <h1>Hush Rules</h1>
      <label class="switch">
        <input type="checkbox" id="auto-toggle" />
        <span>Automatic muting</span>
      </label>
    </header>

    <section id="tab-section">
      <p class="label">Current tab</p>
      <p id="tab-host" class="mono">…</p>
      <p id="tab-mute-state" class="hint"></p>
      <p id="unsupported" class="notice" hidden>
        Hush Rules only works on http:// and https:// pages. This page (for example a browser
        settings page, the New Tab page or a local file) is ignored.
      </p>
    </section>

    <section>
      <p class="label">Matching rules</p>
      <ul id="matching-rules" class="list"></ul>
      <p id="auto-off-note" class="hint" hidden>Automatic muting is off, so rules are not applied.</p>
    </section>

    <section class="actions">
      <button id="add-domain" class="primary" type="button">Add this domain to mute rules</button>
      <button id="toggle-mute" type="button">Mute tab</button>
      <button id="open-options" type="button">Manage rules…</button>
      <p id="feedback" class="hint" role="status" aria-live="polite"></p>
    </section>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
